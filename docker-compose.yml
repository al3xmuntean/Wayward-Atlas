services:
  wayward-atlas:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wayward-atlas
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=file:/app/prisma/dev.db
      - JWT_SECRET=wayward-atlas-production-secret-replace-me-12345
      - LOCAL_AI_URL=http://host.docker.internal:1234/v1
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - NEXT_PUBLIC_APP_NAME=Wayward Atlas
    volumes:
      # Persistent SQLite database volume
      - atlas_db:/app/prisma
      # Persistent user uploads volume (photos & thumbnails)
      - atlas_media:/app/public/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  atlas_db:
    driver: local
  atlas_media:
    driver: local
